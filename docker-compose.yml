version: '3.9'

services:
  db:
    image: postgres:16
    container_name: mantenimiento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mantenimiento_user
      POSTGRES_PASSWORD: mantenimiento_pass
      POSTGRES_DB: mantenimiento_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
